description: jyn's find_workspace_root walks up like git, so a .jyn/ in $HOME captures every subdirectory below it with no escape. Add a -w/--working-dir global flag (plus JYN_WORKING_DIR env) that skips the walk-up and uses the given directory as the workspace root verbatim, so a first `jyn -w ~/projects/x add` there creates a fresh .jyn/ alongside the parent's. Mirrors joy's own -w spelling. Includes bats tests and a short paragraph in the workspace chapter of the tutorial.
comments:

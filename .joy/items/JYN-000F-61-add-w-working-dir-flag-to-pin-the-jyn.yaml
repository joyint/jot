  text: 'Plan: add global -w/--working-dir on the top-level Cli struct (clap env=JYN_WORKING_DIR); before resolving the workspace, canonicalize the path, chdir there, and use it as the root verbatim (skip find_workspace_root''s walk-up so a subdirectory workspace below an ancestor .jyn/ becomes possible). Fail loudly with --working-dir <path>: ... if the target is missing or not a directory. Add three bats cases (walk-up skip, missing dir, JYN_WORKING_DIR env). Add a short paragraph to the ''Where Jyn Stores Your Tasks'' chapter of the tutorial and re-sync the in-crate copy.'
